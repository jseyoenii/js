<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>체질량계산기</title>
</head>
<body>
    <script>
      document.write("<h1>체질량 계산기</h1>");
  
      let weight;
      weight = prompt("체중(kg단위을 입력하세요");
      let height;
      height = prompt("신장(m단위)을 입력하세요");

      document.write("신장");
      document.write(height);
      document.write("체중");
      document.write(weight);
      document.write("<br> bmi:  <br>");

      document.write(weight/(height*height));
    </script>
        
</body>
</html>
